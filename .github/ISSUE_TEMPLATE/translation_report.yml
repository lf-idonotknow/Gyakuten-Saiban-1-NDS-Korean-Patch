name: 오타·번역 수정
description: 오타, 어색한 대사, 원문과 다른 번역을 알려 주세요.
body:
  - type: input
    id: version
    attributes:
      label: 패치 버전
      value: "0.9.1"
    validations:
      required: true
  - type: input
    id: scene
    attributes:
      label: 에피소드와 장면
      placeholder: 몇 화인지, 장소와 대화 상대를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 현재 대사와 수정 의견
      description: 앞뒤 문맥과 화면 사진을 함께 남겨 주세요. 일본어 원문을 알고 있다면 함께 적어 주세요. 게임 ROM은 첨부하지 마세요.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 사용 환경
      placeholder: 에뮬레이터 이름과 버전, 또는 사용 기기를 적어 주세요.
